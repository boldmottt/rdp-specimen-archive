# PR·main 푸시마다 서버·작업일지·컬러연구소 테스트와 화면 스크립트 문법 검사를 돌린다.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 의존성 (Pillow · PyYAML)
        run: python -m pip install pillow pyyaml
      - name: 테스트
        run: python -m unittest discover -s tests -v

  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 화면 스크립트 문법 검사
        run: |
          for f in web/js/*.js; do npx --yes acorn@8.12.1 --ecma2022 --module --silent "$f"; done
          for f in colorlab/web/app.js pccs/web/app.js; do npx --yes acorn@8.12.1 --ecma2022 --silent "$f"; done
      # 검색 문법은 화면 없이 규칙만 검사한다 (web/js/search.js — 순수 함수)
      - name: 화면 규칙 단위 테스트 (검색 문법 · 일괄 편집 · CSV)
        run: node --test tests/search.test.mjs tests/bulk.test.mjs tests/ui-sync.test.mjs tests/color-rules.test.mjs tests/cart-order.test.mjs tests/facets.test.mjs tests/work.test.mjs tests/history.test.mjs tests/mix-compare.test.mjs tests/plates.test.mjs tests/compare.test.mjs tests/worklog-draft.test.mjs tests/csv-import.test.mjs
