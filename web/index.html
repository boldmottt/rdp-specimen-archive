<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDP 시편 아카이브</title>
<link rel="stylesheet" href="styles.css?v=75">
<link rel="stylesheet" href="theme.css?v=9">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand" id="brand">
      <img class="brand-logo" src="/brand/company-logo.png" alt="NIFCO" onerror="this.remove()"><span class="brand-sep" aria-hidden="true"></span><div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 18V6l16 12V6"/></svg></div>
      <div class="brand-txt"><b id="brand-name">RDP</b><span id="brand-sub">SPECIMEN ARCHIVE</span></div>
    </div>
    <nav class="appnav"><a class="on" href="/">시편 아카이브</a><a href="/pccs/">작업일지</a><a href="/lab/">컬러연구소</a></nav>
    <button class="ghost" id="navhome" style="display:none;margin-left:6px">← 목차</button>
    <div class="grow"></div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <input id="search" type="search" aria-label="시편 검색" placeholder="패턴명 · 코드 · 컬러 · 동판" autocomplete="off">
    </div>
    <button class="ghost" id="newbtn">새 시편</button>
    <button class="ghost" id="cartbtn">제안서 <span id="cartbtn-n">0</span></button>
  </div>
</header>

<main id="view"></main>
<div class="cartbar" id="cartbar"></div>

<!-- 편집 드로어 -->
<div class="drawer-scrim" id="drawer-scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <div>
      <div class="eyebrow" style="margin:0 0 4px">Edit</div>
      <strong id="drawer-title">시편 편집</strong>
    </div>
    <button class="icon-btn" id="drawer-close" title="닫기" aria-label="닫기">✕</button>
  </div>
  <div class="drawer-tabs" id="drawer-tabs">
    <button data-tab="base" class="on">기본</button>
    <button data-tab="var">베리에이션</button>
    <button data-tab="mixes">배합</button>
    <button data-tab="images">이미지</button>
    <button data-tab="json">JSON</button>
  </div>
  <div class="drawer-vars" id="drawer-vars"></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot">
    <span id="drawer-msg" class="msg"></span>
    <div class="grow"></div>
    <button class="btn-line" id="drawer-cancel">취소</button>
    <button class="btn-dark" id="drawer-save">저장</button>
  </div>
</aside>

<!-- 이미지 크롭 -->
<div class="crop-modal" id="crop-modal" role="dialog" aria-labelledby="crop-title">
  <div class="crop-box">
    <div class="crop-head">
      <strong id="crop-title">이미지 자르기</strong>
      <span class="hint">170 : 70 고정 · 드래그로 위치, 슬라이더로 확대·기울기</span>
      <button class="icon-btn" id="crop-cancel2" aria-label="닫기">✕</button>
    </div>
    <div class="crop-stage" id="crop-stage">
      <canvas id="crop-img" aria-label="자를 이미지"></canvas>
      <div class="crop-guide"></div>
    </div>
    <div class="crop-controls">
      <label for="crop-zoom">확대</label>
      <input type="range" id="crop-zoom" min="100" max="400" value="100">
      <span id="crop-info" class="hint"></span>
    </div>
    <div class="crop-controls crop-controls-rot">
      <label>회전</label>
      <span class="crop-rot-set" role="group" aria-label="회전">
        <button type="button" class="mini-btn" id="crop-rot-ccw" title="90도 왼쪽으로">⟲ 90°</button>
        <button type="button" class="mini-btn" id="crop-rot-cw" title="90도 오른쪽으로">⟳ 90°</button>
        <button type="button" class="mini-btn" id="crop-rot-dec1" title="1도 빼기">−1°</button>
        <button type="button" class="mini-btn" id="crop-rot-dec01" title="0.1도 빼기">−0.1°</button>
        <input type="number" id="crop-rot-num" min="-180" max="180" step="0.1" value="0" aria-label="회전 각도(도)">
        <button type="button" class="mini-btn" id="crop-rot-inc01" title="0.1도 더하기">+0.1°</button>
        <button type="button" class="mini-btn" id="crop-rot-inc1" title="1도 더하기">+1°</button>
        <button type="button" class="mini-btn" id="crop-rot-reset" title="0도로">0°</button>
      </span>
    </div>
    <div class="crop-foot">
      <button class="btn-line" id="crop-cancel">취소</button>
      <button class="btn-dark" id="crop-ok">이 이미지 사용</button>
    </div>
  </div>
</div>

<div class="plate-pop" id="plate-pop"></div>
<div class="toast" id="toast"></div>

<!-- 주소에 ?v= 를 붙이지 말 것: 다른 모듈이 ./main.js를 import해서 주소가 다르면 두 번 실행된다 (정적 파일은 no-store) -->
<script type="module" src="js/main.js"></script>
</body>
</html>
